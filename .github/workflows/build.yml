name: Compilar PkgDrop Remote

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Instalar SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -2

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon --continue

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PkgDropRemote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
